# SysTelligence — Kickstart Configuration for RHEL/CentOS
# Video: PXE Boot + Kickstart: Deploy 100 Linux Servers Automatically
# github.com/muralipala1504/systelligence-cheatsheets

# Installation method
install
url --url http://192.168.1.10/rhel9/

# System language and keyboard
lang en_US.UTF-8
keyboard us

# Network configuration
network --bootproto=dhcp --device=eth0 --onboot=yes

# Root password (change this)
rootpw --iscrypted $6$randomsalt$hashedpasswordhere

# System timezone
timezone Asia/Kolkata --isUtc

# Disk partitioning — GPT for disks above 2TB
clearpart --all --initlabel
part /boot/efi --fstype=efi --size=512
part /boot --fstype=xfs --size=1024
part pv.01 --size=1 --grow
volgroup vg_root pv.01
logvol / --vgname=vg_root --size=20480 --name=lv_root --fstype=xfs
logvol /var --vgname=vg_root --size=10240 --name=lv_var --fstype=xfs
logvol swap --vgname=vg_root --size=4096 --name=lv_swap

# Bootloader — UEFI
bootloader --location=mbr --boot-drive=sda

# Package selection
%packages
@core
@base
vim
wget
curl
net-tools
%end

# Post installation script
%post
echo "SysTelligence — Server provisioned via Kickstart" >> /etc/motd
systemctl enable sshd
%end

# Reboot after installation
reboot
