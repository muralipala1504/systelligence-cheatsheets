# SysTelligence — Preseed Configuration for Debian/Ubuntu
# Video: PXE Boot + Kickstart: Deploy 100 Linux Servers Automatically
# github.com/muralipala1504/systelligence-cheatsheets

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string systelligence-server
d-i netcfg/get_domain string systelligence.local

# Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Kolkata

# Disk partitioning — GPT for disks above 2TB
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Root and user setup
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$randomsalt$hashedpasswordhere
d-i passwd/make-user boolean false

# Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server vim curl wget net-tools

# Post installation
d-i preseed/late_command string \
    echo "SysTelligence — Server provisioned via Preseed" >> /target/etc/motd

# Reboot after installation
d-i finish-install/reboot_in_progress note
