# SysTelligence — PXE Boot DHCP Configuration
# Video: PXE Boot + Kickstart: Deploy 100 Linux Servers Automatically
# github.com/muralipala1504/systelligence-cheatsheets

default-lease-time 600;
max-lease-time 7200;

# PXE Boot Options
allow booting;
allow bootp;

subnet 192.168.1.0 netmask 255.255.255.0 {
    range 192.168.1.100 192.168.1.200;
    option routers 192.168.1.1;
    option domain-name-servers 8.8.8.8, 8.8.4.4;
    option broadcast-address 192.168.1.255;

    # TFTP Server for PXE
    next-server 192.168.1.10;

    # BIOS/Legacy PXE
    if not exists user-class or not option user-class = "iPXE" {
        filename "pxelinux.0";
    }

    # UEFI PXE
    if option arch = 00:07 {
        filename "grubx64.efi";
    }
}
